<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>萌宠星球 · three.js 虚拟宠物 Demo</title>
<style>
  :root{
    --bg0:#160f2e; --bg1:#241650; --bg2:#34206b;
    --panel:rgba(28,17,56,.74); --panel-line:rgba(255,255,255,.12);
    --ink:#fff7ff; --ink-soft:#c9b8e8; --ink-faint:#8f7cb8;
    --pink:#ff6fa5; --peach:#ffb37a; --mint:#5fe3b3; --sky:#5fc8ff;
    --sun:#ffd166; --grape:#b388ff;
    --r-lg:22px; --r-md:14px; --r-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(255,111,165,.26), transparent 60%),
      radial-gradient(1000px 800px at 6% 112%, rgba(95,200,255,.2), transparent 55%),
      radial-gradient(900px 600px at 50% 50%, rgba(179,136,255,.15), transparent 70%),
      linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2));
  }
  #stage{position:fixed;inset:0} canvas{display:block}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;padding:16px 24px;background:linear-gradient(180deg,rgba(18,9,38,.72),transparent);pointer-events:none}
  .topbar>*{pointer-events:auto}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .orb{width:44px;height:44px;border-radius:15px;background:conic-gradient(from 210deg,var(--pink),var(--sun),var(--mint),var(--sky),var(--grape),var(--pink));box-shadow:0 6px 22px rgba(255,111,165,.45),inset 0 0 12px rgba(255,255,255,.4);display:grid;place-items:center;font-size:24px}
  .logo h1{font-size:20px;font-weight:800;letter-spacing:.5px}
  .logo h1 span{background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo p{font-size:12px;color:var(--ink-soft)}
  .anim-bar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--panel-line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;backdrop-filter:blur(12px);transition:transform .15s,box-shadow .2s}
  .chip:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .chip.on{background:linear-gradient(90deg,var(--pink),var(--grape));border-color:transparent;box-shadow:0 6px 20px rgba(255,111,165,.5)}
  .panel{position:fixed;top:84px;right:20px;bottom:120px;width:300px;z-index:15;background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r-lg);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.4);padding:18px;overflow-y:auto}
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:99px}
  .panel::-webkit-scrollbar-thumb{background:linear-gradient(var(--pink),var(--grape));border-radius:99px}
  .panel h2{font-size:14px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
  .panel .sub{font-size:11px;color:var(--ink-faint);margin-bottom:14px}
  .group{margin-bottom:16px}
  .group .label{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
  .group .label output{color:var(--sun);font-weight:700}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;box-shadow:inset 0 0 6px rgba(0,0,0,.2)}
  .sw.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 12px rgba(255,255,255,.5)}
  input[type=range]{width:100%;-webkit-appearance:none;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;border:3px solid var(--grape);box-shadow:0 2px 8px rgba(0,0,0,.4)}
  select{width:100%;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--panel-line);background:rgba(255,255,255,.07);color:var(--ink);font-size:13px;cursor:pointer;outline:none}
  select option{background:var(--bg1);color:var(--ink)}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
  .toggle span{font-size:12px;color:var(--ink-soft);font-weight:600}
  .switch{width:42px;height:24px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;transition:.2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on{background:linear-gradient(90deg,var(--mint),var(--sky))}
  .switch.on::after{left:21px}
  .actions{display:flex;gap:8px;margin-top:6px}
  .actions button{flex:1;padding:10px 0;border-radius:var(--r-sm);border:none;cursor:pointer;font-weight:700;font-size:12px;color:#fff;transition:.15s}
  .actions button:hover{transform:translateY(-2px)}
  .btn-rand{background:linear-gradient(90deg,var(--grape),var(--sky))}
  .btn-reset{background:rgba(255,255,255,.12)}
  .btn-shot{background:linear-gradient(90deg,var(--pink),var(--peach))}
  .gallery{position:fixed;left:20px;right:340px;bottom:18px;z-index:15;display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r-lg);backdrop-filter:blur(18px);padding:12px 16px;overflow-x:auto}
  .gallery::-webkit-scrollbar{height:8px}
  .gallery::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:99px}
  .gallery::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--sky),var(--mint));border-radius:99px}
  .gallery .g-title{font-size:12px;color:var(--ink-soft);font-weight:800;white-space:nowrap;margin-right:4px}
  .pet{flex:none;width:66px;text-align:center;cursor:pointer;border-radius:var(--r-md);padding:6px 4px;border:1px solid transparent;transition:.18s}
  .pet:hover{background:rgba(255,255,255,.07);transform:translateY(-3px)}
  .pet.on{border-color:var(--sun);background:rgba(255,209,102,.12)}
  .pet .face{width:46px;height:46px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:26px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.15)}
  .pet .g{font-size:10px;color:var(--ink-soft);margin-top:4px;font-weight:600}
  .hint{position:fixed;left:24px;top:84px;z-index:10;font-size:12px;color:var(--ink-faint);background:rgba(18,9,38,.4);padding:8px 14px;border-radius:99px;backdrop-filter:blur(8px)}
  .panel-grip,.panel-close,.fab,.scrim{display:none}
  @media(max-width:820px),(max-height:480px){
    .topbar{padding:10px 14px;gap:10px}
    .logo .orb{width:36px;height:36px;font-size:19px;border-radius:12px}
    .logo h1{font-size:16px}
    .logo p{display:none}
    .anim-bar{margin-left:auto;flex-wrap:nowrap;overflow-x:auto;max-width:54vw;scrollbar-width:none}
    .anim-bar::-webkit-scrollbar{display:none}
    .chip{padding:7px 12px;font-size:12px;white-space:nowrap;flex:none}
    .hint{display:none}
    .gallery{left:10px;right:10px;bottom:10px;padding:8px 10px;gap:6px;border-radius:18px}
    .gallery .g-title{display:none}
    .pet{width:56px;padding:4px 2px}
    .pet .face{width:40px;height:40px;font-size:22px}
    .pet .g{font-size:9px}
    .fab{display:flex;position:fixed;right:14px;bottom:98px;z-index:18;align-items:center;gap:6px;padding:13px 20px;border:none;border-radius:999px;cursor:pointer;color:#fff;font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--grape));box-shadow:0 10px 28px rgba(255,111,165,.5)}
    .fab span{font-size:13px}
    .scrim{display:block;position:fixed;inset:0;z-index:24;background:rgba(10,5,25,.5);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.25s}
    .scrim.on{opacity:1;pointer-events:auto}
    .panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:72vh;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:25;padding:8px 18px 26px}
    .panel.open{transform:translateY(0)}
    .panel-grip{display:flex;justify-content:center;padding:6px 0 10px;cursor:pointer}
    .panel-grip span{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.25)}
    .panel-close{display:grid;place-items:center;margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--panel-line);background:rgba(255,255,255,.08);color:var(--ink-soft);cursor:pointer;font-size:13px}
  }

  [hidden]{display:none!important}
  button{font-family:inherit}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
  .switch{border:0;flex:none}.sw{flex:none}.pet{color:var(--ink);background:transparent;font:inherit}.pet .face,.pet .g{display:block}.pet .face{display:grid}
  .gallery{flex-direction:column;align-items:stretch;gap:8px;overflow:visible}.gallery-row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:3px;flex-shrink:0}
  .grade,.palette-row button{flex:none;border:1px solid var(--panel-line);border-radius:99px;padding:9px 14px;background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer;white-space:nowrap}
  .grade.on{border-color:var(--sun);background:rgba(255,209,102,.16)}.palette-row{display:flex;gap:6px}.panel{bottom:175px}
  .save{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--grape),var(--pink));color:white;font-weight:700;cursor:pointer}
  .local-note,.notice{font-size:12px;line-height:1.6;color:var(--ink-soft);margin:10px 0}.notice:empty{display:none}
  .render-error{position:fixed;z-index:40;top:35%;left:10%;right:10%;padding:24px;max-width:480px;margin:auto;background:#241650;border:1px solid var(--pink);border-radius:20px;line-height:1.8}.render-error button{display:block;margin-top:16px;padding:12px 20px;border:0;border-radius:12px;cursor:pointer}
  .panel-grip{border:0;background:transparent;width:100%}
  @media(max-width:820px),(max-height:480px){.panel{bottom:0;padding-bottom:max(26px,env(safe-area-inset-bottom))}.fab{bottom:170px}.gallery{bottom:max(10px,env(safe-area-inset-bottom));gap:3px}.grade{padding:8px 12px;font-size:12px}.hint{display:block;top:64px;left:14px;font-size:11px}.gallery .g-title{display:block;font-size:10px}.topbar{padding-top:max(10px,env(safe-area-inset-top))}}
  @media(max-height:480px){.gallery{left:10px;right:10px;bottom:4px;padding:3px}.gallery-row{gap:3px;padding:1px}.pet{width:44px;padding:0}.pet .face{width:26px;height:26px;font-size:18px}.grade{padding:4px 9px}.fab{bottom:108px;padding:9px 14px}.hint{display:none}.panel{max-height:80vh}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  .gallery-row{scrollbar-width:thin;scrollbar-color:#a98be5 transparent}.gallery-row::-webkit-scrollbar{height:4px}.gallery-row::-webkit-scrollbar-track{background:transparent}.gallery-row::-webkit-scrollbar-thumb{background:#a98be5;border-radius:8px}
  @media(max-width:820px),(max-height:480px){.panel{visibility:hidden}.panel.open{visibility:visible}}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="可旋转查看的三维萌宠"></div>
<div class="render-error" id="renderError" role="alert" hidden><span>暂时无法显示 3D 萌宠。请重试，或使用支持 WebGL 的浏览器。</span><button id="retryRender" type="button">重新尝试</button></div>
<div class="topbar">
  <div class="logo"><div class="orb">🐾</div><div><h1>萌宠<span>星球</span></h1><p>我的学习伙伴 · 1—9 年级灵感造型</p></div></div>
  <div class="anim-bar" id="animBar">
    <button class="chip on" data-anim="idle">待机</button>
    <button class="chip" data-anim="wave">挥手</button>
    <button class="chip" data-anim="jump">跳跃</button>
    <button class="chip" data-anim="dance">跳舞</button>
    <button class="chip" data-anim="spin">转圈</button>
  </div>
</div>
<div class="hint"><strong id="petName">小狐狸</strong> · 拖拽旋转 · 双指或滚轮缩放</div>
<div class="panel" id="panel" role="dialog" aria-label="萌宠工坊">
  <button type="button" class="panel-grip" id="panelGrip" aria-label="收起萌宠工坊"><span></span></button>
  <h2><span class="dot"></span>萌宠工坊 <button class="panel-close" id="panelClose" aria-label="收起">✕</button></h2>
  <div class="sub">实时调整，立刻看到变化</div>
  <div class="group"><div class="label">宠物种类</div>
    <select id="species" aria-label="宠物种类">
      <option value="fox">🦊 小狐狸</option><option value="cat">🐱 小猫咪</option>
      <option value="bunny">🐰 小兔子</option><option value="panda">🐼 小熊猫</option>
      <option value="dragon">🐲 小火龙</option><option value="unicorn">🦄 独角兽</option>
      <option value="penguin">🐧 小企鹅</option><option value="puppy">🐶 小狗狗</option>
      <option value="slime">🫧 史莱姆</option>
    </select>
  </div>
  <div class="group"><div class="label">主色</div><div class="swatches" id="mainColor"></div></div>
  <div class="group"><div class="label">肚皮/副色</div><div class="swatches" id="bellyColor"></div></div>
  <div class="group"><div class="label">配色灵感</div><div class="palette-row"><button type="button" data-palette="0">原色</button><button type="button" data-palette="1">糖果</button><button type="button" data-palette="2">花园</button></div></div>
  <div class="group"><div class="label">配饰</div>
    <select id="accessory" aria-label="配饰"><option value="none">无</option><option value="bow">蝴蝶结</option><option value="scarf">小围巾</option><option value="crown">小皇冠</option><option value="glasses">圆眼镜</option><option value="flower">小花</option></select>
  </div>
  <div class="group"><div class="label">眼睛大小 <output id="eyeOut">1.0</output></div><input type="range" id="eyeSize" aria-label="眼睛大小" min="0.7" max="1.5" step="0.05" value="1"></div>
  <div class="group"><div class="label">圆润度 <output id="plumpOut">1.0</output></div><input type="range" id="plump" aria-label="圆润度" min="0.8" max="1.35" step="0.05" value="1"></div>
  <div class="group">
    <div class="toggle"><span>腮红</span><button type="button" role="switch" aria-checked="true" aria-label="腮红" class="switch on" id="blushToggle"></button></div>
    <div class="toggle"><span>自动旋转</span><button type="button" role="switch" aria-checked="true" aria-label="自动旋转" class="switch on" id="rotateToggle"></button></div>
    <div class="toggle"><span>背景星光</span><button type="button" role="switch" aria-checked="true" aria-label="背景星光" class="switch on" id="starsToggle"></button></div>
  </div>
  <div class="toggle"><span>动作循环</span><button type="button" role="switch" aria-checked="true" aria-label="动作循环" class="switch on" id="loopToggle"></button></div>
  <p class="local-note">造型仅在此浏览器保存，不关联孩子档案。</p>
  <p class="local-note" id="motionNotice" hidden>已跟随系统减少动态效果：自动动画暂停，仍可换装和手动旋转查看。</p>
  <button type="button" class="save" id="saveBtn">保存本机造型</button>
  <p class="notice" role="status" aria-live="polite" id="notice"></p>
  <div class="actions"><button class="btn-rand" id="randBtn">🎲 随机</button><button class="btn-reset" id="resetBtn">重置</button><button class="btn-shot" id="shotBtn">📷 截图</button></div>
</div>
<div class="gallery" id="gallery"><div class="gallery-row" id="petGallery" role="group" aria-label="九种宠物"></div><div class="gallery-row" id="gradeGallery" role="group" aria-label="年级灵感造型"><span class="g-title">年级灵感<br>仅换造型</span></div></div>
<div class="scrim" id="scrim"></div>
<button class="fab" id="fab" aria-label="打开换装工坊" aria-controls="panel" aria-expanded="false">🎨<span>换装</span></button>

<script src="vendor/three.min.js"></script>
<script src="pet-config.js"></script>
<script src="pet-motion.js"></script>
<script src="pet-models.js"></script>
<script src="pet-controls.js"></script>
<script src="pet-scene.js"></script>
</body>
</html>
